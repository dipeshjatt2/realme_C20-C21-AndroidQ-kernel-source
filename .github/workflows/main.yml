name: Build Android Kernel

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential bc bison flex libssl-dev \
            libelf-dev git zip curl \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python2

      - name: Fix python for MTK scripts
        run: |
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Setup build environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "KCFLAGS=-fcommon" >> $GITHUB_ENV
          echo "HOSTCFLAGS=-fcommon" >> $GITHUB_ENV

      - name: Create output directory
        run: mkdir -p out

      - name: Load defconfig
        run: |
          make O=out ARCH=$ARCH oppo6765_defconfig

      - name: Create stub oppo_phoenix header
        run: |
          mkdir -p vendor/oppo/oppo_phoenix/kernel/oppo_phoenix

          cat << 'EOF' > vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/oppo_phoenix.h
#ifndef _OPPO_PHOENIX_H
#define _OPPO_PHOENIX_H

static inline void phx_set_boot_stage(int stage) {}

#define KERNEL_MM_INIT_DONE 0
#define KERNEL_LOCAL_IRQ_ENABLE 0
#define KERNEL_DELAYACCT_INIT_DONE 0
#define KERNEL_DRIVER_INIT_DONE 0
#define KERNEL_DO_INITCALLS_DONE 0
#define KERNEL_INIT_DONE 0
#define KERNEL_DO_BASIC_SETUP_DONE 0

#endif
EOF

      - name: Build kernel
        run: |
          make -j$(nproc) \
            O=out \
            ARCH=$ARCH \
            CROSS_COMPILE=$CROSS_COMPILE \
            KCFLAGS="$KCFLAGS" \
            HOSTCFLAGS="$HOSTCFLAGS"

      - name: Collect kernel files
        run: |
          mkdir -p kernel
          cp out/arch/arm64/boot/Image.gz kernel/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb kernel/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtb kernel/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/*.dtb kernel/ 2>/dev/null || true

      - name: Package kernel
        run: |
          zip -r kernel-${{ github.run_number }}.zip kernel

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-build-${{ github.run_number }}
          name: Kernel Build ${{ github.run_number }}
          files: kernel-${{ github.run_number }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
