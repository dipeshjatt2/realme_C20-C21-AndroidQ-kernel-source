name: Build Android Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          build-essential bc bison flex libssl-dev \
          libelf-dev gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi git zip

      - name: Setup environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Create output folder
        run: mkdir out

      - name: Load defconfig
        run: |
          make O=out ARCH=$ARCH oppo6765_defconfig

      - name: Build kernel
        run: |
          make -j$(nproc) O=out ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE

      - name: Package kernel
        run: |
          mkdir kernel
          cp out/arch/arm64/boot/Image.gz kernel/ || true
          cp out/arch/arm64/boot/Image.gz-dtb kernel/ || true
          cp out/arch/arm64/boot/dtb kernel/ || true
          zip -r kernel.zip kernel

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: Kernel Build ${{ github.run_number }}
          files: kernel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
